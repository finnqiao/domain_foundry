name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Install the in-repo adapters so their E2E proofs actually run.
          # pytest.pythonpath is not enough for the MCP one: it launches
          # `python -m domain_foundry_mcp.server` as a subprocess (exactly as
          # Claude Desktop does), and a subprocess does not inherit pytest's
          # sys.path — the server died with ModuleNotFoundError and the client
          # reported only "Connection closed". Editable installs make the module
          # importable to the child too.
          #
          # --no-deps on purpose: these adapters declare `domain-foundry-core`,
          # which is not on PyPI yet. It is already present from the editable
          # root install, so skip the resolver entirely and add the one genuine
          # third-party dependency (the MCP SDK) explicitly.
          pip install --no-deps -e ./adapters/mcp -e ./adapters/telegram -e ./adapters/hermes_agent
          pip install "mcp>=1.2.0"
      - name: Ruff
        run: ruff check core tests scripts adapters
      - name: Pyright
        run: pyright
      - name: Frozen-clock audit
        # No bare datetime.now()/utcnow() outside the injectable clock provider.
        run: python scripts/clock_audit.py
      - name: Pytest
        run: pytest
      - name: Eval corpus replay (regression gate)
        # PR gate: deterministic cassette replay of the synthetic corpus, scored
        # per pack and diffed against the committed baseline snapshot. Fails on
        # any per-pack regression (routing/field/disposition) or any increase in
        # false-completed-action cases (release-blocking at zero, plan §10.3).
        run: |
          export DOMAIN_FOUNDRY_HOME="$(mktemp -d)"
          domain-foundry init
          domain-foundry eval --full --min-accuracy 0.9
      - name: Leakscan
        run: python scripts/leakscan.py

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build SPA scaffold
        working-directory: app
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build
          else
            echo "app package not present yet; skipping"
          fi
