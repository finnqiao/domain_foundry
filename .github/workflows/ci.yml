name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Install the in-repo adapters so their E2E proofs actually run.
          # pytest.pythonpath is not enough for the MCP one: it launches
          # `python -m domain_foundry_mcp.server` as a subprocess (exactly as
          # Claude Desktop does), and a subprocess does not inherit pytest's
          # sys.path — the server died with ModuleNotFoundError and the client
          # reported only "Connection closed". Editable installs make the module
          # importable to the child too. Installed *with* dependencies so each
          # adapter's own pyproject stays the single source of truth for its
          # version constraints — notably the MCP SDK's `<2` cap. Their shared
          # `domain-foundry-core` requirement resolves to the editable root
          # install above without touching PyPI (where it is not published yet).
          pip install -e ./adapters/mcp -e ./adapters/telegram -e ./adapters/hermes_agent
      - name: Install JavaScript dependencies for license tests
        working-directory: app
        run: npm ci
      - name: Ruff
        run: ruff check core tests scripts adapters
      - name: Pyright
        run: pyright
      - name: Frozen-clock audit
        # No bare datetime.now()/utcnow() outside the injectable clock provider.
        run: python scripts/clock_audit.py
      - name: Pytest
        run: PYTHONPATH=. pytest
      - name: Eval corpus replay (regression gate)
        # PR gate: deterministic cassette replay of the synthetic corpus, scored
        # per pack and diffed against the committed baseline snapshot. Fails on
        # any per-pack regression (routing/field/disposition) or any increase in
        # false-completed-action cases (release-blocking at zero, plan §10.3).
        run: |
          export DOMAIN_FOUNDRY_HOME="$(mktemp -d)"
          domain-foundry init
          domain-foundry eval --full --min-accuracy 0.9
      - name: Interest suite (create-path ratchet)
        # Scores creation rather than an existing pack: fork a goal, build the
        # offered idea, then say one real domain sentence and check it lands.
        # Offline and deterministic (heuristic provider, one workspace per case).
        # Per-case ratchet against the committed baseline, because aggregate
        # counts hide trades where a fix for one goal breaks another.
        run: |
          export DOMAIN_FOUNDRY_HOME="$(mktemp -d)"
          export DOMAIN_FOUNDRY_LLM=heuristic
          domain-foundry init
          domain-foundry eval interest-suite --min-pass 50
      - name: Leakscan
        run: python scripts/leakscan.py
      - name: Python dependency vulnerabilities
        run: |
          export UV_CACHE_DIR="$(mktemp -d)"
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/domain-foundry-requirements.txt
          pip-audit --strict --no-deps --disable-pip -r /tmp/domain-foundry-requirements.txt
      - name: Foundry knowledge, compiler, and SBOM gates
        run: |
          python scripts/knowledge_audit.py
          python scripts/dependency_license_audit.py
          python scripts/provider_compatibility_audit.py
          python scripts/foundry_audit.py
          python scripts/foundry_heldout_audit.py
          python scripts/generate_sbom.py --output /tmp/domain-foundry.spdx.json

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness (serves the built SPA for the E2E suite)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build SPA
        working-directory: app
        run: |
          # Fail loudly: a missing package.json is a broken checkout, not a
          # reason to skip (the old guard silently green-lit exactly that).
          test -f package.json
          npm ci
          python ../scripts/dependency_license_audit.py --verify-source-texts
          npm run build
      - name: Lint and unit-test SPA
        working-directory: app
        run: |
          npm run lint
          npm test
      - name: Production dependency vulnerabilities
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright (chromium)
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (activation journey)
        working-directory: app
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report

  release-artifact:
    # Gate 0: build the real wheel, then prove a clean machine can go from
    # that artifact to an activated foundry on both claimed operating systems.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build release artifacts (SPA + stage + sdist/wheel + twine check)
        run: bash scripts/build_release.sh
      - name: Clean-machine gate (wheel install, activation, serve, restart)
        run: bash scripts/clean_machine_gate.sh
      - name: Upload dist
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attest release build provenance
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
