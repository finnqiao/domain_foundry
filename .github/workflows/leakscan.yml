name: leakscan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans a commit *range*, which needs the range's parent to
          # exist locally. The default shallow clone cannot resolve it, so the
          # action errored out having scanned ~0 bytes and still reported "no
          # leaks found in partial scan" — a secret-scanning gate that silently
          # scans nothing is worse than one that fires wrongly.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Block sqlite / binaries / private remotes
        run: python scripts/leakscan.py
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
