name: roamboard-sync
channel: roamboard
notes: >
  Roamboard feed/patch import into DomainFoundry travel (Phase 7).
  source_ref shapes: roamboard:trip:{id}, roamboard:timeline_item:{id},
  roamboard:event:{id}. Cutover / launchd flip remain manual.
entities:
  - name: trip
    domain: travel
    object_type: trip
    source_ref_template: "roamboard:trip:{id}"
    id_field: id
    timestamp_field: created_at
    updated_at_field: updated_at
    raw_text_template: "{name} ({primary_destination}) — {status}"
    required_source_fields: [name]
    field_map:
      name: name
      slug: slug
      destination: destination
      primary_destination: primary_destination
      start_date: start_date
      end_date: end_date
      status: status
      readiness_score: readiness_score
      cover_image_path: cover_image_path
      notes_path: notes_path
      notes: notes
  - name: timeline_item
    domain: travel
    object_type: timeline_item
    source_ref_template: "roamboard:timeline_item:{id}"
    id_field: id
    timestamp_field: created_at
    updated_at_field: updated_at
    raw_text_template: "{title} ({item_type}) — {location_name}"
    required_source_fields: [title]
    field_map:
      title: title
      trip: trip
      trip_id: trip_id
      day_id: day_id
      item_type: item_type
      item_type_canonical: item_type_canonical
      day: day
      start_datetime: start_datetime
      end_datetime: end_datetime
      timezone: timezone
      location: location
      location_name: location_name
      lat: lat
      lng: lng
      status: status
      confidence: confidence
      source: source
      sort_order: sort_order
      is_all_day: is_all_day
      is_overnight: is_overnight
      is_flexible: is_flexible
      guest_count: guest_count
      reservation_channel: reservation_channel
      package_label: package_label
      scheduled_at: scheduled_at
      notes: notes
  - name: event_log
    domain: travel
    object_type: event_log
    source_ref_template: "roamboard:event:{id}"
    id_field: id
    timestamp_field: created_at
    updated_at_field: null
    raw_text_template: "{event_type} trip={trip_id}"
    required_source_fields: [event_type]
    actor_field: created_by
    default_actor: roamboard
    field_map:
      event_type: event_type
      trip_id: trip_id
      timeline_item_id: timeline_item_id
      event_json: event_json
      created_by: created_by
      noted_at: created_at
