    # Includes fast/regional routes and Opus 1h cache writes ($20 input).
    # No off-peak or cache-read discounts assumed.
    # Other gateway models have no reviewed live rate and fail closed.
    prices_usd_per_million:
      z-ai/glm-5.2: [2.31, 8.0]
      anthropic/claude-opus-5: [20.0, 50.0]
    official_sources:
