[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-foundry-core"
version = "0.1.0"
description = "Local-first personal agent harness: capture → structured domain data → remixable apps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Domain Foundry contributors" }]
keywords = ["agent", "capture", "local-first", "sqlite", "domain-packs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "typer>=0.12.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "python-ulid>=2.7.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
]

[project.scripts]
domain-foundry = "domain_foundry_core.cli:app"

[project.urls]
Homepage = "https://github.com/finnqiao/domain_foundry"
Documentation = "https://github.com/finnqiao/domain_foundry#readme"
Issues = "https://github.com/finnqiao/domain_foundry/issues"

[tool.hatch.build.targets.wheel]
packages = ["core/domain_foundry_core"]
# The built SPA is gitignored, so hatchling would exclude it. `artifacts` brings
# it back into a *wheel* build.
artifacts = ["core/domain_foundry_core/_webapp/**"]

# Reference packs live outside the package dir, so a wheel shipped without this
# has no packs at all — `domain-foundry pack add food` after `pipx install`
# would have nothing to add. Mirrors loader.bundled_packs_root()'s fallback.
[tool.hatch.build.targets.wheel.force-include]
"packs" = "domain_foundry_core/packs/_bundled"

[tool.hatch.build.targets.sdist]
include = [
  "core/domain_foundry_core",
  "packs",
  "examples",
  "LICENSE",
  "README.md",
]
# `python -m build` builds the wheel *from the sdist*, so anything missing here
# is missing from the wheel no matter what the wheel target declares. The staged
# SPA is gitignored, so without this the documented release command produced a
# wheel with no web app — `serve` would return JSON telling the user to `cd app`,
# in a directory a pipx install does not have. Asserted end-to-end by
# tests/unit/test_spa_packaging.py.
artifacts = ["core/domain_foundry_core/_webapp/**"]

[tool.pytest.ini_options]
# The adapter E2E tests are the only proof the MCP / Telegram / hermes-agent
# harnesses actually work. They lived outside `testpaths`, so a bare `pytest`
# (and therefore CI) never collected them — three of them had previously been
# green on a no-op. Collect them.
testpaths = ["tests", "adapters/hermes_agent/tests", "adapters/mcp/tests", "adapters/telegram/tests"]
# pythonpath makes these importable without pip-installing each adapter, which
# is what CI does (`pip install -e ".[dev]"` covers the root package only).
pythonpath = [
  "core",
  "adapters/hermes_agent/src",
  "adapters/roamboard/src",
  "adapters/mcp/src",
  "adapters/telegram/src",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "tests", "scripts", "adapters/roamboard/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # typer.Option/Argument defaults are idiomatic
  "E501",  # line length — prefer readability in routers/prompts
]

[tool.pyright]
include = ["core", "tests"]
# Pyright does not read pytest's pythonpath. Locally the adapters happen to be
# editable-installed so imports resolved; in CI they are not, which produced 11
# phantom "could not be resolved" errors for domain_foundry_roamboard alone.
extraPaths = [
  "core",
  "adapters/hermes_agent/src",
  "adapters/roamboard/src",
  "adapters/mcp/src",
  "adapters/telegram/src",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
