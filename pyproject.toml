[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-expert-core"
version = "0.1.0"
description = "Local-first personal agent harness: capture → structured domain data → remixable apps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "domain_expert contributors" }]
keywords = ["agent", "capture", "local-first", "sqlite", "domain-packs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "typer>=0.12.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "python-ulid>=2.7.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
]

[project.scripts]
domain-expert = "domain_expert_core.cli:app"

[project.urls]
Homepage = "https://github.com/domain-expert/domain_expert"
Documentation = "https://github.com/domain-expert/domain_expert#readme"
Issues = "https://github.com/domain-expert/domain_expert/issues"

[tool.hatch.build.targets.wheel]
packages = ["core/domain_expert_core"]

[tool.hatch.build.targets.sdist]
include = [
  "core/domain_expert_core",
  "packs",
  "examples",
  "LICENSE",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # typer.Option/Argument defaults are idiomatic
  "E501",  # line length — prefer readability in routers/prompts
]

[tool.pyright]
include = ["core", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
