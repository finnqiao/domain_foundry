app:
  icon: "あ"
  views:
    - {id: due, title: "Due", block: list, object: jp_vocab, config: {group_by: jlpt_level}}
    - {id: vocab, title: "Vocab", block: list, object: jp_vocab, config: {group_by: jlpt_level}}
    - {id: grammar, title: "Grammar", block: list, object: jp_grammar, config: {group_by: jlpt_level}}
    - {id: reviews, title: "Reviews", block: timeline, object: review_event, config: {date_field: reviewed_at}}
    - {id: find, title: "Find", block: search, objects: [jp_vocab, jp_grammar], config: {facets: [jlpt_level, formality]}}
    - {id: stats, title: "SRS", block: stats, object: review_event, config: {measures: [{field: grade, agg: distribution}]}}
    - {id: quiz, title: "Quiz", block: quiz_stats, config: {domain: japanese}}
markdown:
  folder: "06_Japanese"
