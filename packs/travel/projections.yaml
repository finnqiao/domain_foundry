app:
  icon: "🧭"
  views:
    - {id: trips, title: "Trips", block: list, object: trip, config: {group_by: status}}
    - {id: timeline, title: "Timeline", block: timeline, object: timeline_item, config: {date_field: scheduled_at}}
    - {id: plan, title: "Plan", block: planner, object: timeline_item, config: {date_field: day, status_field: status}}
    - {id: bookings, title: "Bookings", block: list, object: booking, config: {group_by: status}}
    - {id: find, title: "Find", block: search, objects: [timeline_item, booking], config: {facets: [item_type, status, booking_type]}}
    - {id: history, title: "History", block: history, object: timeline_item, config: {date_field: scheduled_at, period: day}}
markdown:
  folder: "04_Travel"
