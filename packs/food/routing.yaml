rules:
  # --- lifecycle transitions (updates) win via higher boost -------------------
  - match: "(dropp(?:ed|ing)? the .*idea|shelv(?:ed|ing)? the .*idea|bump(?:ed|ing)? the .*idea|idea is now (?:planned|tried|dropped))"
    object: idea
    operation: update
    confidence_boost: 0.15
  - match: "(tweaked the recipe|updated the recipe|recipe is (?:now )?a keeper|retir(?:ed|ing)? the recipe|promoted the recipe)"
    object: recipe
    operation: update
    confidence_boost: 0.15

  # --- dining: eating out (boost above drink tasting so pairings stay dining) -
  # Ported from Hermes classify: omakase/izakaya/tasting menu + place dining.
  - match: "(\\btasting menu\\b|\\bomakase\\b|\\bizakaya\\b|dined(?: at)?|\\brestaurant\\b|reservation at)"
    object: dining
    operation: create
    confidence_boost: 0.13
  - match: "(ate at|dinner at|lunch at|breakfast at|brunch at|takeout from|ordered (?:the|from)|meal at|\\bcafe\\b|\\bbistro\\b|food truck|(?:flat white|espresso|latte|cortado) at)"
    object: dining
    operation: create
    confidence_boost: 0.12

  # --- concept: an idea you want to chase later -------------------------------
  - match: "(\\bidea\\b|want to (?:try|make|cook)|someday i'?d? (?:like|love)|craving to make|bucket[- ]?list dish|would love to (?:cook|make)|inspiration to try|dinner idea)"
    object: idea
    operation: create
    confidence_boost: 0.12

  # --- recipe: a formalized method --------------------------------------------
  - match: "(\\brecipe\\b|method for making|formula for|recipe card|wrote (?:down|up) (?:the|a) recipe|ingredient|meal prep|leftover)"
    object: recipe
    operation: create
    confidence_boost: 0.12

  # --- recipe attempt / cook test (Hermes recipe_attempt) ---------------------
  - match: "\\b(test|attempt|tried|held better|revision)\\b.*\\b(tofu|dish|recipe|cook|sauce|dough|mapo|stew|curry|bread|pasta)\\b|\\b(mapo|tofu|stew|curry)\\b.*\\b(test|held|better|less|more)\\b"
    object: cook
    operation: create
    confidence_boost: 0.11

  # --- technique / brew notes → observation (Hermes food_note technique) ------
  - match: "\\b(grind|finer|coarser|technique|dial in|extraction|bloom|ratio|steep|brew|ferment|proof|knead|fold|whisk|emulsif|fat wash|milk wash)\\b"
    object: observation
    operation: create
    confidence_boost: 0.11

  # --- drink tasting notes (sake/cocktail/wine/coffee) → observation ----------
  # Boost BELOW dining so restaurant tasting menus with pairings stay dining.
  # Mapped to observation until P2 adds coffee_note/drink_note objects.
  - match: "\\b(sake|junmai|daiginjo|ginjo|honjozo|nigori|namazake|nihonshu)\\b"
    object: observation
    operation: create
    confidence_boost: 0.09
  - match: "\\b(cocktail|martini|negroni|manhattan|margarita|spritz|highball|old fashioned|gimlet|daiquiri|\\bsour\\b)\\b"
    object: observation
    operation: create
    confidence_boost: 0.09
  - match: "\\b(wine|riesling|pinot|nebbiolo|chardonnay|cabernet|merlot|syrah|bordeaux|burgundy|vintage)\\b"
    object: observation
    operation: create
    confidence_boost: 0.09
  - match: "\\b(coffee|espresso|latte|cortado|cappuccino|flat white|pour[- ]?over|V60|aeropress|siphon|cold[- ]?brew|batch brew|single origin|sous vide coffee|roastery)\\b"
    object: observation
    operation: create
    confidence_boost: 0.09

  # --- observation: a learning / takeaway -------------------------------------
  - match: "(learned that|noticed that|next time i|takeaway:|note to self|lesson learned|observation:|realized that)"
    object: observation
    operation: create
    confidence_boost: 0.1

  # --- personal.sqlite v2 note types ----------------------------------------
  # Skip cocktail contexts so espresso/coffee-liqueur cocktail menus stay drink_note.
  - match: "^(?!.*\\bcocktail\\b).*(?:\\bcoffee\\b|espresso|latte|cappuccino|cold[- ]?brew|\\broaster\\b|\\bcafe\\b.{0,20}(?:coffee|espresso))"
    object: coffee_note
    operation: create
    confidence_boost: 0.12

  - match: "(\\bwine\\b|\\bsake\\b|\\bbeer\\b|\\bcocktail\\b|tasting note|nose:|palate:|\\bvintage\\b|alcohol[- ]?pct)"
    object: drink_note
    operation: create
    confidence_boost: 0.11

  - match: "(dining note|restaurant note|revisit (?:yes|no)|ambience|service was)"
    object: dining_note
    operation: create
    confidence_boost: 0.1

  - match: "(recipe attempt|attempt(?:ed)? (?:the|this) recipe|cook(?:ed)? attempt|tried the recipe)"
    object: recipe_attempt
    operation: create
    confidence_boost: 0.12

  - match: "(food note:|kitchen note:|mise note:)"
    object: food_note
    operation: create
    confidence_boost: 0.1

  # --- experiment: cooking something (kept last so specific rules win) --------
  - match: "(cooked|\\bmade\\b|tried (?:making|cooking)|test kitchen|experiment(?:ed)? with|batch of|whipped up|simmered|roasted|braised|pan[- ]?fried)"
    object: cook
    operation: create
    confidence_boost: 0.08

examples:
  - text: "idea: a miso caramel banana bread someday"
    expect: {object: idea, operation: create, fields: {status: someday}}
  - text: "want to try a smoked paprika chickpea stew"
    expect: {object: idea, operation: create}
  - text: "wrote down the recipe for cold-brew tare ramen"
    expect: {object: recipe, operation: create}
  - text: "recipe card for 24-hour focaccia, serves 8"
    expect: {object: recipe, operation: create, fields: {servings: 8}}
  - text: "cooked a batch of shoyu ramen, came out great"
    expect: {object: cook, operation: create, fields: {outcome: great}}
  - text: "made kimchi fried rice, decent but too salty"
    expect: {object: cook, operation: create, fields: {outcome: decent}}
  - text: "dinner at River Station Grill, the duck was great"
    expect: {object: dining, operation: create, fields: {meal_type: dinner, rating: great}}
  - text: "ate at a tiny bistro near the market, good bowls"
    expect: {object: dining, operation: create, fields: {rating: good}}
  - text: "learned that resting the dough overnight fixes the crumb"
    expect: {object: observation, operation: create}
  - text: "tweaked the recipe: less sugar, more salt"
    expect: {object: recipe, operation: update}
  - text: "dropping the sous-vide egg idea, never works for me"
    expect: {object: idea, operation: update, fields: {status: dropped}}
  # Hermes fewshot ports (synthetic places; drink/coffee tasting → v2 note objects)
  - text: "Harbor Tasting Room tasting menu with junmai daiginjo pairing on course 3"
    expect: {object: dining, operation: create}
  - text: "cocktail menu — Love Potion with coffee liqueur and espresso; Old Fashioned specs"
    expect: {object: drink_note, operation: create}
  - text: "mapo tofu test — held better with less chili oil this revision"
    expect: {object: cook, operation: create}
  - text: "dialed in the V60, grind finer, 1:16 ratio, 45s bloom"
    expect: {object: observation, operation: create}
  - text: "Pastel de Nata recipe: dough 250g flour, custard with egg yolks, bake hot"
    expect: {object: recipe, operation: create}
  - text: "omakase at the corner izakaya, reservation at 7"
    expect: {object: dining, operation: create}
  - text: "junmai tasting notes — fragrant, dry finish, bottle from the shop"
    expect: {object: drink_note, operation: create}
  - text: "coffee at Heart, ethiopian pour-over, bright acidity"
    expect: {object: coffee_note, operation: create, fields: {drink_name: ethiopian pour-over}}
  - text: "sake tasting note: Dassai 45, clean nose, dry finish"
    expect: {object: drink_note, operation: create, fields: {category: sake}}
  - text: "dining note: River Station Grill, revisit yes, great ambience"
    expect: {object: dining_note, operation: create, fields: {restaurant: River Station Grill, revisit: true}}
  - text: "recipe attempt: focaccia, outcome great, less salt next time"
    expect: {object: recipe_attempt, operation: create, fields: {outcome: great}}
  - text: "food note: remember to toast the spices before blooming"
    expect: {object: food_note, operation: create}

negative_examples:
  - text: "the app build is toast"
  - text: "deploy the release candidate tonight"
  - text: "merge the feature flag behind a gate"
  # Health/supplement must not become food (P0 fitness-rule lesson; health pack is P2)
  - text: "magnesium 400mg capsule after the evening run"
  - text: "took creatine and vitamin D this morning"

llm_hints: >
  Distinguish the lifecycle stages: an idea is something to try later; a recipe
  is a written method; a cook is one attempt at making something; dining is a
  meal eaten out; an observation is a learning to remember. Prefer cook over
  idea/recipe when the message describes actually making food. "Made" / "cooked"
  is a cook, not a recipe. Ratings/outcomes are enums (great, good, decent).
  Restaurant tasting menus (and pairings that mention sake/wine/cocktail) are
  dining, not drink tasting notes. Standalone sake/cocktail/wine tasting →
  drink_note; coffee/espresso/cafe drinks → coffee_note; brew technique notes
  (grind/bloom/ratio without a coffee drink framing) stay observations.
  Structured restaurant revisit notes → dining_note; explicit recipe attempts →
  recipe_attempt; "mapo tofu test, held better…" cooks stay cook. Venue geo
  (lat/lng/place_*) is optional. For dining / coffee_note / dining_note /
  drink_note, always extract place_name when the text names a cafe, restaurant,
  or bar (e.g. "flat white at Onibus Nakameguro" → place_name=Onibus Nakameguro).
  Do not invent lat/lng; leave null when unknown (lazy geocode / backfill later).
