# Composition. Both keys are optional, and a pack that leaves them out works
# exactly as it always has.
#
# extends: build on another pack. You get every object, routing rule, and view
# it has, under your own tables, and anything you declare here wins over what
# it declared. One parent only, and a loop between packs is an error.
#
# extends: travel
#
# imports: borrow an object from another pack by name. Nothing is copied: the
# borrowed records stay in the pack that owns them, and your links point at
# them. Use `as` when the name would clash with one of your own objects.
#
# imports:
#   - {from: food, object: dining}
#   - {from: food, object: recipe, as: dish}
