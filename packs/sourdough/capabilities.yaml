compatibility:
  core: ">=0.1,<2"
  capabilities:
    derived_metrics: ">=1,<2"
    media: ">=1,<2"
    compare: ">=1,<2"

capabilities:
  derived_metrics:
    version: 1
    object: bake
    metrics:
      - id: hydration_percent
        label: Hydration
        expression: "water_g / flour_g * 100"
        fields: [water_g, flour_g]
        unit: "%"
        precision: 1
      - id: hydration_delta
        label: Hydration Δ
        expression: "hydration - previous.hydration"
        fields: [hydration]
        unit: percentage_points
        precision: 1
      - id: bulk_hours_delta
        label: Bulk time Δ
        expression: "bulk_hours - previous.bulk_hours"
        fields: [bulk_hours]
        unit: hours
        precision: 1

  media:
    version: 1
    galleries:
      - id: crumb_photos
        title: Crumb photos
        object: bake
        field: crumb_photos
        source: capture_attachments
        accept: [image/jpeg, image/png, image/webp]

  compare:
    version: 1
    comparisons:
      - id: bakes
        title: Compare bakes
        object: bake
        label_field: loaf_name
        metrics: [hydration_percent, hydration_delta, bulk_hours_delta]
