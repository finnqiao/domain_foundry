[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-foundry-hermes-agent"
version = "0.1.0"
description = "hermes-agent plugin: capture/query/correct/review/new_domain tools over HTTP to a local domain-foundry serve"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Domain Foundry contributors" }]
keywords = ["hermes-agent", "plugin", "agent", "capture", "domain-foundry"]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "domain-foundry-core",
]

# Published so hermes-agent can discover the plugin without extra config.
# Value must be a *module* path (Hermes calls ep.load() then module.register(ctx)).
# Do not use "module:register" — that makes ep.load() return the function itself.
[project.entry-points."hermes_agent.plugins"]
domain_foundry = "domain_foundry_hermes_agent.plugin"

[project.urls]
Homepage = "https://github.com/finnqiao/domain_foundry"
Documentation = "https://github.com/finnqiao/domain_foundry/tree/main/adapters/hermes_agent#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_foundry_hermes_agent"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "domain_foundry_hermes_agent/plugin.yaml"
"SKILL.md" = "domain_foundry_hermes_agent/SKILL.md"
