name: domain_foundry
version: 0.1.0
title: "Domain Foundry harness"
description: >
  Capture-first personal-agent harness. Exposes capture / query / correct /
  review / new_domain tools that talk to a local `domain-foundry serve` over HTTP.
kind: hermes-agent-plugin

# Python entry point (group `hermes_agent.plugins`): hermes-agent imports this
# and calls `register(ctx)`.
# Module path (not module:register) — Hermes 0.14+ loads the module then
# calls register(ctx).
entry_point: "domain_foundry_hermes_agent.plugin"

# Compatibility range. Keep the upper bound loose so hermes update does not
# block discovery; conformance tests document the actually-tested host.
supported_hermes_agent: ">=0.4,<1"

# How the plugin reaches the harness. Read from the host context first, then env.
config:
  base_url:
    env: DOMAIN_FOUNDRY_URL
    default: "http://127.0.0.1:8787"
    description: "Base URL of the running `domain-foundry serve` instance."
  token:
    env: DOMAIN_FOUNDRY_API_TOKEN
    default: null
    description: "Bearer token when the harness is not bound to localhost."

tools:
  - name: domain_foundry_capture
    summary: "Capture the user's verbatim message into the harness ledger."
  - name: domain_foundry_query
    summary: "Read-only query over captured entries."
  - name: domain_foundry_ask
    summary: "Answer a question from captured records."
  - name: domain_foundry_correct
    summary: "Apply a one-message correction to an existing capture."
  - name: domain_foundry_review_list
    summary: "List approval-queue items awaiting a decision."
  - name: domain_foundry_review_resolve
    summary: "Resolve one approval-queue item."
  - name: domain_foundry_new_domain
    summary: "Start the idea-atlas wizard (neighborhood, not an installed pack)."
  - name: domain_foundry_wizard_reply
    summary: "Send one reply to an active wizard session."
  - name: domain_foundry_atlas_search
    summary: "Browse the idea atlas without installing a pack."
  - name: domain_foundry_inspect_pack
    summary: "Read pack YAML without changing it."
  - name: domain_foundry_suggest
    summary: "Neighbor-idea or hardening suggestion from recent captures."
  - name: domain_foundry_apply_pack_edit
    summary: "Preview or apply a natural-language pack edit."

# Behavioral guidance injected into the agent (see SKILL.md).
guidance_file: SKILL.md
