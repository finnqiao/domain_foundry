[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-foundry-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Domain Foundry: capture/query/correct/review/new_domain tools for any MCP client (Claude Desktop, Cursor, ...)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Domain Foundry contributors" }]
keywords = ["mcp", "model-context-protocol", "claude", "agent", "capture", "domain-foundry"]
dependencies = [
  # Capped at <2 deliberately. server.py imports `mcp.server.fastmcp.FastMCP`,
  # which the 2.x line moved — an unbounded `mcp>=1.2.0` meant a fresh
  # `pipx install domain-foundry-mcp` resolved to 2.0.0 and the server failed to
  # start with ModuleNotFoundError, surfacing to the client as the singularly
  # unhelpful "Connection closed". Porting to the 2.x API is a separate change.
  "mcp>=1.2.0,<2",
  "domain-foundry-core",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

# `domain-foundry-mcp` runs the stdio server — the command MCP clients launch.
[project.scripts]
domain-foundry-mcp = "domain_foundry_mcp.server:main"

[project.urls]
Homepage = "https://github.com/finnqiao/domain_foundry"
Documentation = "https://github.com/finnqiao/domain_foundry/tree/main/adapters/mcp#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_foundry_mcp"]
