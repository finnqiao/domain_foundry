(()=>{"use strict";const data=JSON.parse(document.getElementById("prototype-data").textContent);const stages=[{id:"research",label:"Research",note:"real practice"},{id:"concepts",label:"Three Cuts",note:"product concepts"},{id:"remix",label:"Remix",note:"lineaged splice"},{id:"model",label:"Model",note:"workload fit"},{id:"experience",label:"Experience",note:"task topology"},{id:"build",label:"Build",note:"same artifact"},{id:"proof",label:"Proof",note:"independent gates"}];let caseIndex=0,stageIndex=0,frameMobile=false;const esc=v=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const label=v=>String(v).replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase());const current=()=>data.cases[caseIndex];
function renderNav(){document.getElementById("cases").innerHTML=data.cases.map((item,i)=>`<button class="case-tab" role="tab" aria-selected="${i===caseIndex}" data-case="${i}">${esc(item.title)}</button>`).join("");document.querySelectorAll("[data-case]").forEach(b=>b.addEventListener("click",()=>{caseIndex=Number(b.dataset.case);render()}));document.getElementById("stages").innerHTML=stages.map((item,i)=>`<button class="stage-button" ${i===stageIndex?'aria-current="step"':""} data-stage="${i}"><span class="stage-index mono">${String(i+1).padStart(2,"0")}</span><span class="stage-label">${item.label}<small>${item.note}</small></span></button>`).join("");document.querySelectorAll("[data-stage]").forEach(b=>b.addEventListener("click",()=>{stageIndex=Number(b.dataset.stage);render()}))}
const sourceMap=spec=>Object.fromEntries(spec.source_records.map(s=>[s.id,s]));function renderSources(spec){const map=sourceMap(spec);const stage=stages[stageIndex].id;let ids=new Set(spec.source_ids);if(stage==="concepts")ids=new Set(spec.concepts.flatMap(c=>c.evidence_ids).map(id=>spec.evidence.find(e=>e.id===id)?.source_id).filter(Boolean));if(stage==="model")ids=new Set(spec.domain.entities.flatMap(e=>e.evidence_ids).map(id=>spec.evidence.find(e=>e.id===id)?.source_id).filter(Boolean));document.getElementById("sources").innerHTML=`<div><div class="eyebrow mono">source monitor</div><h2>Evidence in this cut</h2><p class="plain-note">Sources inform facts and patterns. Product hypotheses and user choices remain labeled separately.</p></div>${[...ids].slice(0,5).map(id=>{const s=map[id];return s?`<article class="evidence-card"><span class="evidence-kind">${esc(s.tier)} · ${esc(s.license)}</span><strong>${esc(s.title)}</strong><p>${esc((s.topics||[]).join(" · "))}</p><a href="${esc(s.url)}" target="_blank" rel="noreferrer">Open source</a></article>`:""}).join("")}`}
function head(spec,title,decision){return `<header class="monitor-head"><div><div class="eyebrow mono">${esc(spec.id)} / ${String(stageIndex+1).padStart(2,"0")}</div><h2>${title}</h2></div><p class="decision">${decision}</p></header>`}function actions(){return `<div class="stage-actions"><button type="button" data-prev ${stageIndex===0?"disabled":""}>Previous stage</button><button type="button" class="next" data-next ${stageIndex===stages.length-1?"disabled":""}>Next: ${stageIndex<stages.length-1?stages[stageIndex+1].label:"complete"}</button></div>`}
function research(s){return head(s,"Start with the practice.",s.research.desired_outcome)+`<div class="grid"><section class="paper span-7"><div class="eyebrow">research brief</div><h3>${esc(s.research.interest)}</h3><ul class="fact-list"><li><strong>First useful act</strong>${esc(s.research.first_value)}</li><li><strong>What they actually do</strong>${s.research.practice.map(esc).join(" · ")}</li><li><strong>Usage context</strong>${s.research.usage_context.map(esc).join(" · ")}</li></ul></section><section class="paper span-5"><div class="eyebrow">current artifacts</div><h3>What already exists</h3><ul class="fact-list">${s.research.existing_artifacts.map(v=>`<li>${esc(v)}</li>`).join("")}</ul></section><section class="paper span-12"><div class="eyebrow">evidence atoms</div><h3>Claims with locators</h3><ul class="fact-list">${s.evidence.slice(0,6).map(e=>`<li><span class="evidence-kind">${esc(e.use)}</span><strong>${esc(e.claim)}</strong><span class="mono muted">${esc(e.source_id)}${e.locator?` / ${esc(e.locator)}`:""}</span></li>`).join("")}</ul></section></div>`+actions()}
function concepts(s){return head(s,"Three cuts, not three themes.","Each concept disagrees about the primary loop, affordance, and boundary. Choosing one is a product decision with data consequences.")+`<div class="concepts">${s.concepts.map(c=>`<article class="cut ${c.id===s.remix.selected_concept?"selected":""}"><div class="eyebrow mono">${esc(c.id)}</div><h3>${esc(c.title)}</h3><div><p><strong>${esc(c.thesis)}</strong></p><p>${esc(c.primary_loop)}</p><p class="muted">Primary affordance: ${esc(c.primary_affordance)}</p><ul>${c.tradeoffs.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div><button class="select-cut" type="button" aria-pressed="${c.id===s.remix.selected_concept}">${c.id===s.remix.selected_concept?"Selected cut":"Compare as base"}</button></article>`).join("")}</div>`+actions()}
function remix(s){const selected=s.concepts.find(c=>c.id===s.remix.selected_concept);return head(s,"Splice with lineage.",`The base remains ${selected.title}; borrowed fragments are explicit, cited, and reproducible.`)+`<div class="grid"><section class="paper span-5"><div class="eyebrow">selected base</div><h3>${esc(selected.title)}</h3><p>${esc(selected.thesis)}</p><p><strong>Kept boundary</strong></p><ul>${selected.feature_boundary.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section><section class="paper span-7"><div class="eyebrow">resulting remix diff</div><h3>${s.remix.fragments.length} deliberate splices</h3><div class="fragment-list">${s.remix.fragments.map(f=>`<div class="fragment"><span class="fragment-kind">${esc(f.kind)}</span><div><strong>${esc(f.fragment)}</strong><p class="muted">from ${esc(label(f.from_concept))} — ${esc(f.reason)}</p></div></div>`).join("")}</div></section><section class="paper span-12"><span class="decision-path mono">remix.user_decisions</span><ul>${s.remix.user_decisions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section></div>`+actions()}
function model(s){return head(s,"Model the questions, then the tables.",`${s.domain.workloads.length} named workloads justify ${s.domain.entities.length} entities, ${s.domain.relationships.length} relationships, and ${s.domain.indexes.length} indexes.`)+`<div class="grid"><section class="paper span-12"><div class="eyebrow">identity and lifecycle</div><h3>Domain entities</h3><div class="entity-strip">${s.domain.entities.map(e=>`<span class="entity"><strong>${esc(e.title)}</strong><br><small>${esc(e.kind)} · ${esc(e.identity.join(" + "))}</small></span>`).join("")}</div></section><section class="paper span-7"><div class="eyebrow">stored invariants</div><h3>Relationship graph</h3>${s.domain.relationships.map(r=>`<div class="relationship"><span>${esc(label(r.from_entity))}</span><span class="arrow mono">${esc(r.cardinality)} / ${esc(r.on_delete)}</span><span>${esc(label(r.to_entity))}</span></div>`).join("")}</section><section class="paper span-5"><div class="eyebrow">query-shaped design</div><h3>User workloads</h3>${s.domain.workloads.map(w=>`<div class="workload"><strong>${esc(w.question)}</strong><br><small>${esc(w.acceptance)}</small></div>`).join("")}</section><section class="paper span-12"><details><summary>Inspect executable SQLite DDL</summary><pre class="mono" style="white-space:pre-wrap;overflow:auto">${esc(s.schema_sql)}</pre></details></section></div>`+actions()}
function experience(s){const t=s.experience.visual_world.tokens;return head(s,"A task world, not a skin.",`${s.experience.visual_world.name} uses a ${s.experience.navigation.topology} topology. Shared accessible primitives remain consistent; composition and density do not.`)+`<div class="grid"><section class="paper span-4"><div class="eyebrow">visual contract</div><h3>${esc(s.experience.visual_world.name)}</h3><p>${esc(s.experience.visual_world.mood)}</p><div class="token-row">${[t.background,t.surface,t.text,t.muted,t.accent,t.accent_alt,t.border].map(x=>`<span style="background:${esc(x)}" title="${esc(x)}"></span>`).join("")}</div><ul>${s.experience.visual_world.signature_elements.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section><section class="paper span-8"><div class="eyebrow">view contact sheet</div><h3>${esc(label(s.experience.navigation.topology))} topology</h3><div class="grid">${s.experience.views.map(v=>`<article class="view-card span-6"><div class="mono muted">${esc(v.id)}</div><strong>${esc(v.title)}</strong><p>${esc(v.purpose)}</p><ul>${v.regions.map(r=>`<li>${esc(r.kind)} / ${esc(r.title)} / ${r.span} columns</li>`).join("")}</ul></article>`).join("")}</div></section><section class="paper span-12"><div class="eyebrow">complete state contract</div><p>${[...new Set(s.experience.views.flatMap(v=>v.states))].map(label).join(" · ")}</p><p><strong>${esc(s.experience.accessibility.target)}</strong> — ${s.experience.accessibility.keyboard_model.map(esc).join(" · ")}</p></section></div>`+actions()}
function build(s){return head(s,"Preview equals owned app.","This frame is the compiler output—not a look-alike mockup. The same FoundrySpec also generated the schema, evidence snapshot, README, and build receipt.")+`<section class="paper"><div class="frame-tools"><button type="button" data-frame="desktop" aria-pressed="${!frameMobile}">Desktop</button><button type="button" data-frame="mobile" aria-pressed="${frameMobile}">Mobile</button><span class="mono muted">app.html / localStorage / JSON export</span></div><iframe class="app-frame ${frameMobile?"mobile":""}" title="${esc(s.title)} owned application preview" sandbox="allow-scripts allow-modals allow-downloads" srcdoc="${esc(s.owned_app_html)}"></iframe></section>`+actions()}
function proof(s){return head(s,"Claims stop at the gates.","Generator-authored examples cannot be their own judge. These cases name the independent owner and exact expected outcome; release thresholds block claims that are not proved.")+`<div class="grid"><section class="paper span-8"><div class="eyebrow">evaluation contract</div><h3>Independent cases</h3><table class="proof-table"><thead><tr><th>Kind</th><th>Input</th><th>Expected</th><th>Owner</th></tr></thead><tbody>${s.evaluation.cases.map(c=>`<tr><td>${esc(c.kind)}</td><td>${esc(c.input)}</td><td>${esc(c.expected)}</td><td>${esc(label(c.authored_by))}</td></tr>`).join("")}</tbody></table></section><section class="paper span-4"><div class="eyebrow">owned exit</div><h3>Bundle contents</h3><ul class="fact-list"><li><strong>foundry-spec.json</strong>complete decision contract</li><li><strong>schema.sql</strong>executable identities and constraints</li><li><strong>app.html</strong>same preview, usable offline</li><li><strong>evidence.json</strong>frozen sources and derivations</li><li><strong>build-receipt.json</strong>hashes and compiler identity</li></ul><p class="status good"><span class="dot"></span>golden compiler gates pass</p></section></div>`+actions()}
function render(){const s=current();renderNav();renderSources(s);const f={research,concepts,remix,model,experience,build,proof}[stages[stageIndex].id];document.getElementById("main").innerHTML=f(s);document.querySelector("[data-prev]")?.addEventListener("click",()=>{stageIndex=Math.max(0,stageIndex-1);render()});document.querySelector("[data-next]")?.addEventListener("click",()=>{stageIndex=Math.min(stages.length-1,stageIndex+1);render()});document.querySelectorAll("[data-frame]").forEach(b=>b.addEventListener("click",()=>{frameMobile=b.dataset.frame==="mobile";render()}));}render()})();
</script></body></html>
