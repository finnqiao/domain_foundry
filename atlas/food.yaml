nodes:
  - id: food
    kind: bucket
    title: Food
    aliases: [cooking, kitchen, eat, eating, cuisine, recipes, meals, culinary, cocktail, cocktails, drinks]
    pitch: Cooking, eating out, nutrition, fermentation, and what you learn in the kitchen.
  - id: food.cooking
    kind: practice
    title: Home cooking
    aliases: [recipes, recipe, cook, cooking, kitchen]
    pitch: Recipes you keep, cooks you try, and what you change next time.
  - id: food.cooking.recipe_lab
    kind: idea
    title: Recipe lab
    aliases: [recipe tracker, recipe box, cookbook]
    pitch: A living catalog of recipes plus each cook — keepers, flops, and tweaks.
    jobs: [catalog, event_log, lab]
    provenance: both
    domain_slug: recipes
    identity_hint: recipe_name
    example: cooked the shoyu ramen again, 40 minutes, keeper
    jargon: [mise, reduction, fond, al dente, rest]
    world_analogs:
      - {name: Paprika, one_liner: Recipe manager with grocery lists}
      - {name: NYT Cooking, one_liner: Recipe box and ratings}
  - id: food.cooking.cook_journal
    kind: idea
    title: Cook journal
    aliases: [what I cooked, dinner log]
    pitch: One card per cook — what you made, how it went, what you'd change.
    jobs: [event_log]
    provenance: foundry
    domain_slug: cooks
    identity_hint: dish_name
    example: weeknight carbonara, too salty, next time less pecorino
    jargon: [weeknight, leftover, batch cook]
  - id: food.cooking.cocktail_book
    kind: idea
    title: Cocktail book
    aliases: [cocktail recipes, bar book, house cocktails]
    pitch: The specs you actually make at home, plus the night you changed one.
    jobs: [catalog, event_log, lab]
    provenance: foundry
    domain_slug: cocktails
    identity_hint: drink_name
    example: stirred a rye old fashioned, two dashes of bitters
    jargon: [stirred, shaken, dashes, spirit-forward]
    vocabulary:
      [cocktail, stirred, shaken, rye, bitters, coupe, vermouth, amaro, gin,
       syrup, twist, garnish, dilution, jigger, sour]
    routing_examples:
      - {text: "stirred a rye old fashioned, two dashes of bitters", object: event}
      - {text: "served it up in a coupe with a lemon twist", object: event}
      - {text: "swapped the vermouth for amaro, less sweet", object: event}
      - {text: "gin sour with a bar spoon of syrup, good dilution", object: event}
      - {text: "added the house negroni spec to the book", object: catalog}
    negative_examples:
      - stirred the soup while the pasta boiled
      - the gin bottle is on the top shelf
    llm_hints: >
      A spec is the drink (ratios like 2:1:1, the garnish); a night is one time
      you made it. "Up", "stirred" and "coupe" describe how it was served.
  - id: food.nutrition
    kind: practice
    title: Nutrition
    aliases: [calories, macros, diet, protein, tracking food]
    pitch: Daily intake, trends, and whether a change is actually working.
  - id: food.nutrition.nutrition_tracker
    kind: idea
    title: Nutrition tracker
    aliases: [calorie tracker, macro tracker, diet log]
    pitch: Log meals and see protein, calories, or whatever you actually care about over time.
    jobs: [event_log, improvement]
    provenance: world
    domain_slug: nutrition
    identity_hint: meal_name
    example: lunch was leftover chili, about 40g protein
    jargon: [macros, kcal, protein, fiber]
    world_analogs:
      - {name: MyFitnessPal, one_liner: Calorie and macro diary}
      - {name: Cronometer, one_liner: Micronutrient-heavy food log}
  - id: food.nutrition.habit_trend
    kind: idea
    title: Eating-habit trend
    aliases: [how I eat, meal pattern]
    pitch: Not a calorie database — a trend of how you eat (late dinners, veg days, travel weeks).
    jobs: [event_log, improvement]
    provenance: foundry
    domain_slug: eating
    identity_hint: meal_name
    example: ate out three nights this week, energy crashed Thursday
    jargon: [late dinner, takeout, home cooked]
  - id: food.dining
    kind: practice
    title: Dining out
    aliases: [restaurants, eating out, cafes, been-to]
    pitch: Places, dishes, and a map of where you've eaten.
  - id: food.dining.dining_atlas
    kind: idea
    title: Dining map
    aliases: [food map, restaurant map, been-to map]
    pitch: A map of places you've eaten with the dish you'd order again.
    jobs: [event_log, atlas, media_dex]
    provenance: both
    domain_slug: dining
    identity_hint: place
    example: dinner at River Station Grill, the duck was great
    jargon: [omakase, tasting menu, hole in the wall]
    vocabulary:
      [ramen, tonkotsu, omakase, izakaya, sushi, taco, bistro, brunch,
       reservation, courses, counter, corkage, walk-in, tab, waitlist, dish]
    routing_examples:
      - {text: "the new ramen shop on 5th, tonkotsu was rich", object: event}
      - {text: "omakase at the counter, twelve courses", object: event}
      - {text: "booked a reservation for the tasting menu downtown", object: event}
      - {text: "the taco place by the park, al pastor again", object: event}
      - {text: "dinner at the bistro, the duck was great", object: event}
      - {text: "hole in the wall izakaya near the station, no waitlist", object: event}
    negative_examples:
      - the kitchen tap is dripping again
      - fed the starter this morning
    llm_hints: >
      A dish name (tonkotsu, al pastor, omakase) belongs to the visit, not to
      the place. Prefer the place a person names — "the ramen shop on 5th" —
      over the neighbourhood.
    world_analogs:
      - {name: Google Maps saved lists, one_liner: Pins and starred places}
      - {name: Untappd, one_liner: "Check-ins with a map, for beer"}
  - id: food.dining.site_graph
    kind: idea
    title: Site graph
    aliases: [restaurant graph, venue graph, food graph]
    pitch: Places linked to dishes, visits, and people — a graph of your food life, not a list.
    jobs: [catalog, event_log, graph, atlas]
    provenance: foundry
    domain_slug: foodgraph
    identity_hint: place
    example: same counter at the soba shop, sat at the bar, had the duck tsukemen
    jargon: [regular, counter, omakase]
  - id: food.fermentation
    kind: practice
    title: Fermentation
    aliases: [sourdough, koji, pickles, kombucha, ferment, bake, bakes, baking]
    pitch: Starters, jars, and bakers' experiments.
  - id: food.fermentation.bake_lab
    kind: idea
    title: Sourdough / bake lab
    aliases: [sourdough, bread lab, hydration, bake, bakes, loaf, discard, discard recipes]
    pitch: Hydration, bulk, crumb — compare bakes and keep the starter alive.
    jobs: [lab, event_log, improvement, media_dex]
    provenance: both
    analog_pack: sourdough
    domain_slug: sourdough
    identity_hint: loaf_name
    example: baked a 75% hydration country loaf, crumb was open
    jargon: [levain, bulk, batard, oven spring]
    world_analogs:
      - {name: Breadboard / bakery notebooks, one_liner: Formula and bake notes}
  - id: food.fermentation.starter_journal
    kind: idea
    title: Starter journal
    aliases: [starter log, levain log, discard]
    pitch: Feedings, discard, and whether the culture is actually lively.
    jobs: [event_log, lab]
    provenance: foundry
    domain_slug: starter
    identity_hint: starter_name
    example: fed the rye starter, doubled in 5 hours
    jargon: [levain, discard, peak]
  # Whisky is a shipped product target, not eval-fitting: the repository
  # carries a hand-authored FoundrySpec and compiled bundle for it at
  # examples/showcase/whisky-tasting/. An atlas that pleads ignorance about
  # whisky while the repo ships a whisky app is incoherent.
  - id: food.drinks
    kind: practice
    title: Drinks
    aliases: [whisky, whiskey, spirits, dram, bottle shelf, mixology]
    pitch: Bottles on the shelf, pours you actually remember, and what your palate keeps returning to.
  - id: food.drinks.tasting_notes
    kind: idea
    title: Tasting notes
    aliases: [whisky notes, dram log, bottle log]
    pitch: A bottle, a pour, and the note you'd still trust six months later — your palate, not strangers' ratings.
    jobs: [catalog, event_log]
    provenance: foundry
    domain_slug: drams
    identity_hint: bottle_name
    example: peated Islay dram, iodine and salt, 12 year
    jargon: [dram, peated, cask strength, sherry cask, nose palate finish]
    vocabulary:
      [dram, peated, neat, iodine, cask, sherry, bourbon, rye, malt, islay,
       nose, palate, finish, abv, pour, distillery, bottling, orchard, smoky, sealed]
    routing_examples:
      - {text: "peated Islay dram, iodine and salt on the nose", object: event}
      - {text: "the 12 year neat, orchard fruit and a long finish", object: event}
      - {text: "poured a sherry cask malt, the palate was thin", object: event}
      - {text: "smoky and sweet, better with a drop of water", object: event}
      - {text: "added a bourbon to the shelf, cask strength, still sealed", object: catalog}
      - {text: "the Islay bottling from that distillery is half gone", object: catalog}
    negative_examples:
      - the printer is out of toner again
      - finished the last chapter on the train
    llm_hints: >
      A bottle is the thing owned; a dram is one pour of it. "Neat", an age
      statement and a cask type describe the pour; nose, palate and finish are
      the three parts of the note and should stay verbatim.
  - id: food.coffee
    kind: practice
    title: Coffee
    aliases: [espresso, pour over, v60, brew]
    pitch: Brews, beans, and whether the cup actually improved.
  - id: food.coffee.brew_lab
    kind: idea
    title: Brew lab
    aliases: [coffee log, v60 log]
    pitch: Ratio, grind, and taste — compare brews the way a bake lab compares loaves.
    jobs: [lab, event_log, improvement]
    provenance: both
    analog_pack: coffee
    domain_slug: coffee
    identity_hint: brew_name
    example: V60 Ethiopian, 15g in 250g out, tasted like blueberry
    jargon: [V60, bloom, pourover, ristretto]
    world_analogs:
      - {name: Beanconqueror, one_liner: Brew ratio and bean diary}
  - id: food.coffee.bean_shelf
    kind: idea
    title: Bean shelf
    aliases: [coffee beans, bag log]
    pitch: Bags on the shelf and which ones actually got used.
    jobs: [catalog, event_log]
    provenance: foundry
    domain_slug: beans
    identity_hint: bean_name
    example: opened the Ethiopian natural, 15 days off roast
    jargon: [roast date, natural, washed]

