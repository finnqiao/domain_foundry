  - {from: sports.soccer, to: sports.soccer.tactical_notebook, rel: child}
  - {from: sports.climbing, to: sports.climbing.session_log, rel: child}
  - {from: sports.climbing, to: sports.climbing.project_board, rel: child}
  - {from: sports.running, to: sports.running.run_log, rel: child}
  - {from: sports.cycling, to: sports.cycling.ride_log, rel: child}
  - {from: sports.strength, to: sports.strength.session_log, rel: child}
  - {from: sports.soccer.training_log, to: sports.soccer.pickup_map, rel: expands_to}
  - {from: sports.soccer.training_log, to: sports.soccer.tactical_notebook, rel: expands_to}
  - {from: sports.climbing.session_log, to: sports.climbing.project_board, rel: expands_to}
  - {from: sports.running, to: sports.cycling, rel: adjacent}
  - {from: sports.climbing, to: sports.strength, rel: adjacent}
