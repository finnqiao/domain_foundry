nodes:
  - id: sports
    kind: bucket
    title: Sports
    aliases: [sport, athletic, training, workout, gym, fitness]
    pitch: Games, training, and whether you're actually getting better.
  - id: sports.soccer
    kind: practice
    title: Soccer
    aliases: [football, futbol, futsal, pickup]
    pitch: Sessions, pickups, and the notes a generic workout log will miss.
  - id: sports.soccer.training_log
    kind: idea
    title: Training log
    aliases: [soccer training, session log]
    pitch: What you worked on — first touch, finishing, minutes — not just “went to the gym”.
    jobs: [event_log, improvement]
    provenance: both
    domain_slug: soccer
    identity_hint: session_name
    example: pickup at the park, played 8, first touch was sloppy in the rain
    jargon: [first touch, weak foot, box, through ball]
    world_analogs:
      - {name: Teambuildr / team apps, one_liner: Club training diaries}
  - id: sports.soccer.pickup_map
    kind: idea
    title: Pickup map
    aliases: [pickup games, where we play]
    pitch: Where the games are, who showed, and the pitch condition.
    jobs: [event_log, atlas]
    provenance: foundry
    domain_slug: pickup
    identity_hint: pitch_name
    example: Sunday pickup at McKinley, 10v10, grass was long
    jargon: [pickup, turf, 7v7]
  - id: sports.soccer.tactical_notebook
    kind: idea
    title: Tactical notebook
    aliases: [tactics, formation notes]
    pitch: Patterns you noticed — not a FIFA tactics screen, your actual games.
    jobs: [catalog, event_log]
    provenance: foundry
    domain_slug: tactics
    identity_hint: pattern_name
    example: they kept overloading our left, we never tucked the 8
    jargon: [overloaded, half space, press]
  - id: sports.climbing
    kind: practice
    title: Climbing
    aliases: [bouldering, boulder, sport climbing, crag, gym climbing]
    pitch: Sends, projects, and grades at the gym or crag.
  - id: sports.climbing.session_log
    kind: idea
    title: Session log
    aliases: [climbing log, bouldering log, sends]
    pitch: Routes, grades, and whether you sent, flashed, or worked it.
    jobs: [event_log, media_dex]
    provenance: both
    domain_slug: climbing
    identity_hint: route_name
    example: sent a tough V5 on the overhang, crux was the heel hook
    jargon: [heel hook, crux, flash, send, overhang]
    world_analogs:
      - {name: Topo / Crag, one_liner: Outdoor route logs}
  - id: sports.climbing.project_board
    kind: idea
    title: Project board
    aliases: [projects, send list]
    pitch: A catalog of projects plus the sessions you threw at them.
    jobs: [catalog, event_log, improvement]
    provenance: foundry
    domain_slug: projects
    identity_hint: route_name
    example: still projecting the red overhang, heel hook is the move
    jargon: [project, beta, limit]
  - id: sports.running
    kind: practice
    title: Running
    aliases: [run, jog, 5k, marathon]
    pitch: Runs, paces, and whether the work is landing.
  - id: sports.running.run_log
    kind: idea
    title: Run log
    aliases: [running log]
    pitch: Distance, time, and how it felt — with a trend if you care.
    jobs: [event_log, improvement]
    provenance: world
    domain_slug: running
    identity_hint: run_name
    example: easy 8k along the canal, legs heavy from yesterday
    jargon: [easy, tempo, strides, splits]
    world_analogs:
      - {name: Strava, one_liner: Activity social network}
  - id: sports.running.shoe_rotation
    kind: idea
    title: Shoe rotation
    aliases: [running shoes]
    pitch: Which pair did the miles, and when it's done.
    jobs: [catalog, event_log]
    provenance: foundry
    domain_slug: shoes
    identity_hint: shoe_name
    example: easy 8k in the trainers, 420 km on them now
    jargon: [trainers, carbon plate]
  - id: sports.cycling
    kind: practice
    title: Cycling
    aliases: [bike, ride, zwift]
    pitch: Rides and whether the legs are coming around.
  - id: sports.cycling.ride_log
    kind: idea
    title: Ride log
    aliases: [bike log]
    pitch: Route, distance, and how the ride felt.
    jobs: [event_log, improvement, atlas]
    provenance: world
    domain_slug: cycling
    identity_hint: ride_name
    example: 42 km along the coast in 1 hour 38 minutes
    jargon: [ftp, cadence, gravel]
    world_analogs:
      - {name: Strava, one_liner: Ride log and segments}
  - id: sports.cycling.bike_garage
    kind: idea
    title: Bike garage
    aliases: [which bike]
    pitch: Which bike did the ride, and what you changed on it.
    jobs: [catalog, event_log]
    provenance: foundry
    domain_slug: bikes
    identity_hint: bike_name
    example: gravel bike for the coast loop, swapped the 38s
    jargon: [gravel, tubeless]
  - id: sports.strength
    kind: practice
    title: Strength
    aliases: [gym, lifting, weights, workout]
    pitch: Sessions, lifts, and progress that isn't a spreadsheet religion.
  - id: sports.strength.session_log
    kind: idea
    title: Lifting log
    aliases: [workout log, gym log]
    pitch: What you lifted and how it felt — enough to see if you're stronger.
    jobs: [event_log, improvement]
    provenance: world
    domain_slug: lifting
    identity_hint: lift_name
    example: dumbbell rows felt strong, added extra reps on the bench
    jargon: [RPE, sets, deload, top set, working set]
    vocabulary:
      [squat, deadlift, bench, press, row, chin-up, 5x5, 3x8, AMRAP, PR,
       deload, RPE, reps, kg, grind, tempo, superset, accessory]
    measure: {name: top_set, unit: kg}
    routing_examples:
      - {text: "back squat 3x5 at 120kg, bar speed was good", object: event}
      - {text: "deadlift single at RPE 9, then a deload week", object: event}
      - {text: "bench press 5x5, the last rep was ugly", object: event}
      - {text: "overhead press stalled again, dropped to 3x8", object: event}
      - {text: "new PR on the squat, 140kg for a double", object: event}
      - {text: "chin-ups and accessory rows after the main lift", object: event}
    negative_examples:
      - pressed for the deadline all afternoon
      - the elevator is out of order again
    llm_hints: >
      "5x5" is sets x reps; "100kg" is the load. A grind, a miss, or an RPE
      number describes how the top set felt. Squat, bench, deadlift and press
      are the lift, not the session name.
    world_analogs:
      - {name: Strong, one_liner: Set-by-set lifting log}
  - id: sports.strength.lift_catalog
    kind: idea
    title: Lift catalog
    aliases: [which lifts]
    pitch: The lifts you actually train, plus the sessions you threw at them.
    jobs: [catalog, event_log, improvement]
    provenance: foundry
    domain_slug: lifts
    identity_hint: lift_name
    example: dumbbell rows felt strong, added extra reps on the bench
    jargon: [RPE, sets, deload, top set, working set]
    vocabulary:
      [squat, deadlift, bench, press, row, 5x5, 3x8, AMRAP, PR, deload, RPE,
       reps, kg, grind, accessory]
    measure: {name: top_set, unit: kg}
    routing_examples:
      - {text: "added the front squat to the rotation", object: catalog}
      - {text: "the low-bar back squat is the main lift this block", object: catalog}
      - {text: "back squat 3x5 at 120kg, bar speed was good", object: event}
      - {text: "deadlift single at RPE 9, then a deload week", object: event}
      - {text: "bench press 5x5, the last rep was ugly", object: event}
      - {text: "overhead press stalled again, dropped to 3x8", object: event}

